<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba - Galería</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: #0f0f0f; min-height: 100vh; }

  .header { text-align: center; padding: 30px 20px 16px; }
  .header h1 { font-family:'Bebas Neue',sans-serif; font-size:2rem; color:#fff; letter-spacing:.06em; }
  .header p { color:#666; font-size:.8rem; margin-top:4px; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px; max-width:500px; margin:0 auto; }

  .card {
    border-radius:20px; overflow:hidden; cursor:pointer; position:relative;
    box-shadow:0 4px 24px rgba(0,0,0,.45); aspect-ratio:1/1.05;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  }
  .card:active { transform:scale(.96); }
  .card-bg { position:absolute; inset:0; z-index:0; background-size:cover; background-position:center; }
  .card-overlay { position:absolute; inset:0; z-index:1; }
  .card-body { position:relative; z-index:2; width:100%; padding:12px; text-align:center; }
  .card-name { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.6); line-height:1.1; }
  .card-tag { display:inline-block; margin-top:5px; font-size:.65rem; font-weight:900; letter-spacing:.1em; text-transform:uppercase; padding:2px 8px; border-radius:99px; color:#fff; background:rgba(255,255,255,.2); }

  .card-duck .card-bg { background: linear-gradient(160deg,#ff3e8a 0%,#ff6e00 55%,#ffd000 100%); }
  .card-duck .card-overlay { background: linear-gradient(to top,rgba(180,30,80,.85) 0%,transparent 55%); }

  .card-russia .card-overlay { background: linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 55%); }

  /* MODAL */
  .modal-backdrop { display:none; position:fixed; inset:0; background:#000; z-index:100; flex-direction:column; }
  .modal-backdrop.open { display:flex; }
  .modal-topbar { width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px 18px; flex-shrink:0; background:#111; }
  .modal-title { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:.06em; color:#fff; }
  .modal-close { background:rgba(255,255,255,.12); border:none; color:#fff; font-size:1.3rem; width:38px; height:38px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .modal-content { flex:1; width:100%; overflow-y:auto; }

  .img-gallery { width:100%; display:flex; flex-direction:column; gap:10px; padding:10px; }
  .img-gallery img { width:100%; border-radius:12px; display:block; box-shadow:0 4px 20px rgba(0,0,0,.5); cursor:pointer; }

  .img-fullscreen { display:none; position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:200; align-items:center; justify-content:center; }
  .img-fullscreen.open { display:flex; }
  .img-fullscreen img { max-width:100%; max-height:100%; object-fit:contain; }
  .img-fullscreen-close { position:absolute; top:16px; right:16px; background:rgba(255,255,255,.15); border:none; color:#fff; font-size:1.5rem; width:44px; height:44px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  .spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,.15); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; margin:60px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .error-msg { color:#f88; text-align:center; padding:40px 20px; font-size:.9rem; line-height:1.6; }
</style>
</head>
<body>

<div class="header">
  <h1>Prueba Galería</h1>
  <p>Russia y Duck con imágenes de Cloudinary</p>
</div>

<div class="grid">

  <div class="card card-duck" onclick="openModal('duck')">
    <div class="card-bg"></div>
    <div class="card-overlay"></div>
    <div class="card-body">
      <div class="card-name">Super Duck</div>
      <span class="card-tag">Ver ofertas →</span>
    </div>
  </div>

  <div class="card card-russia" onclick="openModal('russia')">
    <div class="card-bg" id="russiaCardBg"></div>
    <div class="card-overlay"></div>
    <div class="card-body">
      <div class="card-name">Russia Distribución</div>
      <span class="card-tag">Ver ofertas →</span>
    </div>
  </div>

</div>

<div class="img-fullscreen" id="fullscreen">
  <button class="img-fullscreen-close" onclick="closeFullscreen()">✕</button>
  <img id="fullscreenImg" src="" alt="">
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal-topbar">
    <span class="modal-title" id="modalTitle"></span>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
const C = 'day96momf';

const DISTRIBUIDORAS = {
  duck: {
    nombre: "Super Duck",
    imagenes: [
      `https://res.cloudinary.com/${C}/image/upload/duck/InCollage_20260520_112716469_r2cshu`
    ]
  },
  russia: {
    nombre: "Russia Distribución",
    imagenes: [
      `https://res.cloudinary.com/${C}/image/upload/russia/InCollage_20260526_110829041_urq6og`,
      `https://res.cloudinary.com/${C}/image/upload/russia/InCollage_20260527_105419730_l4afws`,
      `https://res.cloudinary.com/${C}/image/upload/russia/InCollage_20260603_140848246_ds9ypo`,
      `https://res.cloudinary.com/${C}/image/upload/russia/InCollage_20260602_124054940_kob2jq`
    ]
  }
};

// Poner logo de Russia en la tarjeta
document.getElementById('russiaCardBg').style.backgroundImage =
  `url('https://res.cloudinary.com/${C}/image/upload/russia/Screenshot_20260606-185151_rpdlti')`;

function openModal(key) {
  const dist = DISTRIBUIDORAS[key];
  document.getElementById('modalTitle').textContent = dist.nombre;
  const content = document.getElementById('modalContent');
  content.innerHTML = '<div class="spinner"></div>';
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Verificar que las imágenes cargan
  const imgs = dist.imagenes.map(src =>
    `<img src="${src}" alt="${dist.nombre}" loading="lazy"
      onclick="openFullscreen('${src}')"
      onerror="this.style.display='none'; document.getElementById('errMsg').style.display='block'">`
  ).join('');

  setTimeout(() => {
    content.innerHTML = `
      <div id="errMsg" style="display:none" class="error-msg">
        ⚠️ Algunas imágenes no cargaron.<br>Verificar URLs en Cloudinary.
      </div>
      <div class="img-gallery">${imgs}</div>`;
  }, 400);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modalContent').innerHTML = '';
  document.body.style.overflow = '';
}

function openFullscreen(src) {
  document.getElementById('fullscreenImg').src = src;
  document.getElementById('fullscreen').classList.add('open');
}

function closeFullscreen() {
  document.getElementById('fullscreen').classList.remove('open');
  document.getElementById('fullscreenImg').src = '';
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('fullscreen').addEventListener('click', function(e) {
  if (e.target === this) closeFullscreen();
});
</script>
</body>
</html>
